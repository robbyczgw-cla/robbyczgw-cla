<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Robby Czesany · Agentic engineer</title>
  <desc id="d">I build agent infrastructure that shows its work: the source, the receipt, the diff.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e4ede7" opacity=".08"/></pattern>
    <radialGradient id="glowA" cx="85%" cy="0%" r="60%"><stop offset="0" stop-color="#b9f26a" stop-opacity=".16"/><stop offset="1" stop-color="#b9f26a" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0%" cy="100%" r="55%"><stop offset="0" stop-color="#ffb86b" stop-opacity=".10"/><stop offset="1" stop-color="#ffb86b" stop-opacity="0"/></radialGradient>
    <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#b9f26a"/><stop offset="1" stop-color="#ffb86b"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" rx="14" fill="#090d0c"/>
  <rect width="1200" height="320" rx="14" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="14" fill="url(#glowA)"/>
  <rect width="1200" height="320" rx="14" fill="url(#glowB)"/>
  <g stroke="#b9f26a" stroke-opacity=".8" fill="none">
    <path d="M24 44V24H44M1156 24H1176V44M24 276V296H44M1156 296H1176V276"/>
  </g>
  <text x="64" y="74" fill="#ffb86b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.5">01 · AGENTIC ENGINEER · GRAZ, AUSTRIA</text>
  <text x="62" y="146" fill="#e4ede7" font-family="Georgia,'Times New Roman',serif" font-size="66" letter-spacing="-2">Robby Czesany</text>
  <text x="64" y="200" fill="#a3b2aa" font-family="Georgia,'Times New Roman',serif" font-size="25">I build agent infrastructure that <tspan fill="url(#hl)" font-style="italic">shows its work:</tspan></text>
  <text x="64" y="232" fill="#a3b2aa" font-family="Georgia,'Times New Roman',serif" font-size="25">the source, the receipt, the diff.</text>
  <text x="64" y="274" fill="#7f8f87" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="1">design → agent → review → test → ship</text>
  <g transform="translate(975 160)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#b9f26a">
    <g fill="none" stroke="#b9f26a">
      <path d="M-150 0H150M0 -150V150" stroke-opacity=".25"/>
      <circle r="128" stroke-opacity=".5"/>
      <circle r="118" stroke-opacity=".6" stroke-dasharray="1 7"/>
      <circle r="100" stroke-opacity=".7"/>
      <circle r="62" stroke-opacity=".6"/>
      <g filter="url(#glow)">
        <circle r="100" stroke-width="7" stroke-dasharray="380 1000" transform="rotate(-90)">
          <animate attributeName="stroke-dasharray" values="0 1000;628 1000;628 1000" keyTimes="0;.7;1" dur="6s" repeatCount="indefinite"/>
        </circle>
      </g>
      <path d="M-14 -10 0 0-14 10M4 10H22" stroke-width="3" filter="url(#glow)"/>
    </g>
    <g fill="#090d0c" stroke="#b9f26a"><circle cx="0" cy="-128" r="4"/><circle cx="122" cy="-40" r="4"/><circle cx="75" cy="104" r="4"/><circle cx="-75" cy="104" r="4"/><circle cx="-122" cy="-40" r="4"/></g>
    <text x="0" y="-138" text-anchor="middle">01 DESIGN</text>
    <text x="132" y="-44">02 AGENT</text>
    <text x="84" y="124">03 REVIEW</text>
    <text x="-84" y="124" text-anchor="end">04 TEST</text>
    <text x="-132" y="-44" text-anchor="end">05 SHIP</text>
  </g>
</svg>
